# Bouwt ToolMatch en publiceert via GitHub Pages (build_type workflow).
# Alleen de publieke sitebestanden gaan live (scripts/assemble.py → _site); test/, scripts/, README.md en package.json niet.
# Vereist: Pages-instelling 'Source: GitHub Actions' (build_type workflow).
name: Deploy ToolMatch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - name: Build controleren (gecommitte html moet gelijk zijn aan de build)
        run: python3 scripts/build.py && git status --porcelain && test -z "$(git status --porcelain)"
      - name: Publieke bestanden verzamelen
        run: python3 scripts/assemble.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
